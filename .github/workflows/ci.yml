name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Droits minimaux : le workflow peut seulement lire le code
permissions:
  contents: read

# Si on pousse à nouveau sur la même branche, l'ancien run est annulé
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. Lint (API + front) ----------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installer les dépendances de l'API
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        working-directory: backend
        run: ruff check .
      - name: Ruff (format)
        working-directory: backend
        run: ruff format --check .

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances du front
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

  # ---------- 2. Tests de l'API ----------
  tests-backend:
    name: tests-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Pytest avec couverture
        run: pytest

  # ---------- 3. Tests du front ----------
  tests-frontend:
    name: tests-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vitest
        run: npm test
      - name: Build de production
        run: npm run build

  # ---------- 4. Tests de bout en bout ----------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Lancé seulement si les trois autres jobs sont verts
    needs: [lint, tests-backend, tests-frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Préparer le .env
        run: cp .env.example .env
      - name: Démarrer la stack Docker Compose
        run: docker compose up -d --build --wait
      - name: Attendre que l'API réponde à travers le front
        run: timeout 90 bash -c 'until curl -fsS http://localhost:8080/api/health/ready; do sleep 2; done'

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances du front
        working-directory: frontend
        run: npm ci
      - name: Installer Chromium et ses dépendances système
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Logs de la stack (en cas d'échec)
        if: failure()
        run: docker compose logs
      - name: Conserver le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v